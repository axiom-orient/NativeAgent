name: LiteRTQualification
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  LiteRTProvider:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  LiteRTQualification:
    type: application
    platform: iOS
    sources:
      - App
      - path: ${LITERT_MODEL_DIR}/Qwen3.5-0.8B_int8.litertlm
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axiomorient.nativeagent.litert-qualification
    dependencies:
      - package: LiteRTProvider
  LiteRTQualificationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LiteRTQualification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axiomorient.nativeagent.litert-qualification-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LiteRTQualification.app/LiteRTQualification"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LiteRTQualification:
    build:
      targets:
        LiteRTQualification: all
        LiteRTQualificationTests: [test]
    test:
      targets: [LiteRTQualificationTests]
